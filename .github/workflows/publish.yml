name: YouTube Shorts Publisher - Scheduled Dry Run

on:
  workflow_dispatch:
  schedule:
    # 15:00 and 20:00 Egypt time (UTC+3 at the time this was configured).
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project files
        run: |
          test -f upload_short.py
          test -f queue.json
          test -f titles.txt
          test -f state.json
          python -m py_compile upload_short.py

      - name: Run publisher in DRY RUN mode only
        run: python upload_short.py
