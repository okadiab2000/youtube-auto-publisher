
name: YouTube Shorts Publisher - Scheduled Dry Run

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: write

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project files
        run: |
          test -f upload_short.py
          test -f queue.json
          test -f titles.txt
          test -f state.json

      - name: Run publisher in DRY RUN mode
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python upload_short.py

      - name: Verify state has not changed
        run: git diff --exit-code -- state.json

      - name: Persist state if changed
        run: |
          if git diff --quiet -- state.json; then
            echo "No state changes to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add state.json
          git commit -m "Update YouTube publishing state"
          git push origin HEAD:main
