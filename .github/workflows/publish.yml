name: YouTube Shorts Publisher - Safe Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safe-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify project files
        run: |
          python --version
          test -f upload_short.py
          test -f queue.json
          test -f titles.txt
          test -f state.json
          echo "Safe test passed. No video was uploaded."
