
name: YouTube Shorts Publisher - Safe Test

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *"
    - cron: "0 17 * * *"

permissions:
  contents: read

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project files
        run: |
          test -f upload_short.py
          test -f queue.json
          test -f titles.txt
          test -f state.json

      - name: Run safe dry run
        env:
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
        run: python upload_short.py

      - name: Confirm state unchanged
        run: git diff --exit-code -- state.json

      - name: Report result
        run: echo "Safe dry run completed. No YouTube upload was requested."
