name: YouTube Shorts Publisher - Scheduled Dry Run

on:
  workflow_dispatch:
  schedule:
    # Check hourly; the script decides the correct Cairo hour (handles DST).
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: youtube-shorts-publisher
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate project files
        run: |
          test -f upload_short.py
          test -f queue.json
          test -f titles.txt
          test -f state.json
          python -m py_compile upload_short.py

      - name: Check Cairo publishing slot
        id: slot
        run: python upload_short.py --check-slot

      - name: Run publisher in DRY RUN mode only
        if: steps.slot.outputs.allowed == 'true'
        run: python upload_short.py
