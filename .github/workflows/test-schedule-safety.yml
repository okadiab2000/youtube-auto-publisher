name: Test Cairo Schedule Safety (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schedule-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile and test schedule logic
        run: |
          python -m py_compile upload_short.py test_schedule_safety.py
          python -m unittest -v test_schedule_safety.py

      - name: Preview next selection without external API calls
        run: python preview_next.py
