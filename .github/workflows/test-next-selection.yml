name: Test Next Video Selection (Read Only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-next:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate selection preview
        run: |
          python -m py_compile preview_next.py
          python preview_next.py
